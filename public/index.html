<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>temp</title>
  </head>
  <body>
    <h1>temp</h1>
    <form id="uploadForm">
      <input type="file" id="fileInput" required />
      <button type="submit">Upload</button>
    </form>
    <p id="result"></p>
    <button id="copyBtn" style="display: none">Copy Link</button>

    <script>
      const ID_CHARS = "abcdefghijklmnopqrstuvwxyz0123456789";

      async function deriveKeyFromChar(char) {
        const encoder = new TextEncoder();
        const hash = await crypto.subtle.digest(
          "SHA-256",
          encoder.encode(char),
        );
        return crypto.subtle.importKey("raw", hash, "AES-GCM", false, [
          "encrypt",
          "decrypt",
        ]);
      }

      function bufToBase64Url(buf) {
        const bytes = new Uint8Array(buf);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");
      }

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const file = document.getElementById("fileInput").files[0];
          const resultEl = document.getElementById("result");

          resultEl.textContent = "Uploading...";

          const keyChar = ID_CHARS[Math.floor(Math.random() * ID_CHARS.length)];
          const key = await deriveKeyFromChar(keyChar);
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const fileBuf = await file.arrayBuffer();

          const encrypted = await crypto.subtle.encrypt(
            { name: "AES-GCM", iv },
            key,
            fileBuf,
          );

          const ivB64 = bufToBase64Url(iv);

          const res = await fetch("/api/upload", {
            method: "POST",
            headers: {
              "Content-Type": file.type || "application/octet-stream",
              "X-Encryption-IV": ivB64,
            },
            body: encrypted,
          });

          if (!res.ok) {
            resultEl.textContent = "Upload failed.";
            return;
          }

          const data = await res.json();
          const link = location.origin + "/v/" + data.id + "#" + keyChar;
          resultEl.textContent = "Link: " + link;

          const copyBtn = document.getElementById("copyBtn");
          copyBtn.style.display = "inline-block";
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(link);
            copyBtn.textContent = "Copied!";
            setTimeout(() => {
              copyBtn.textContent = "Copy Link";
            }, 1500);
          };
        });
    </script>
  </body>
</html>
